services:
  postgres:
    image: postgres:15
    container_name: urlify_postgres

    environment:
      POSTGRES_USER: urlify
      POSTGRES_PASSWORD: urlify_secret
      POSTGRES_DB: urlify_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlify -d urlify_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: urlify_redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: