services:

  postgres:
    image: postgres:15
    container_name: urlify_postgres

    environment:
      POSTGRES_USER: urlify
      POSTGRES_PASSWORD: urlify_secret
      POSTGRES_DB: urlify_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlify -d urlify_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: urlify_redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: urlify_app

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: urlify_prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    depends_on:
      - app

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: urlify_grafana

    ports:
      - "3000:3000"
    
    env_file:
    - .env

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD:  ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

      # Anonymous access
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"

       # SMTP Configuration 
      GF_SMTP_ENABLED:  ${GF_SMTP_ENABLED}
      GF_SMTP_HOST: ${GF_SMTP_HOST}
      GF_SMTP_USER: ${GF_SMTP_USER}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME}
      GF_SMTP_SKIP_VERIFY:  ${GF_SMTP_SKIP_VERIFY}

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


volumes:
  pgdata:
  grafana_data: